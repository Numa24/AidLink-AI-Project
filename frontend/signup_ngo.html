<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NGO Sign Up | AidLink</title>
  <link rel="stylesheet" href="signup.css">
</head>
<body>
  <div class="signup-container">
    <h2>NGO Sign Up</h2>
    <form>
      <label for="orgname">Organization Name</label>
      <input type="text" id="orgname" required>

      <label for="email">Email</label>
      <input type="email" id="email" required>

      <label for="password">Password</label>
      <input type="password" id="password" required>

      <label for="focus">Cause/Focus Area</label>
      <input type="text" id="focus" placeholder="e.g., Education, Healthcare, Environment">

      <label for="location">Location</label>
      <input type="text" id="location" placeholder="City/Area">

      <label for="desc">About the NGO</label>
      <textarea id="desc" rows="3" placeholder="Short description about your NGO"></textarea>

      <label for="contact">Contact Number</label>
      <input type="tel" id="contact">

      <button type="submit" class="btn">Sign Up</button>
    </form>
  </div>
</body>
</html>
